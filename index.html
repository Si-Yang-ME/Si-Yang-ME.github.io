<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111923">
    <meta name="description" content="与 AI 对弈的五子棋游戏">
    <title>五子棋 · 与 AI 对弈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="brand-copy">
                <p class="eyebrow">CLASSIC STRATEGY · AI CHALLENGE</p>
                <h1>五子棋 <span>GOMOKU</span></h1>
                <p class="subtitle">落子之间，见招拆招。</p>
            </div>
            <div class="header-chip"><span class="live-dot"></span> 单人对弈</div>
        </header>

        <section class="game-container" aria-label="五子棋游戏">
            <div class="board-wrapper">
                <div class="board-heading">
                    <div>
                        <span class="section-kicker">THE BOARD</span>
                        <h2>对弈棋盘</h2>
                    </div>
                    <span class="board-size">15 × 15</span>
                </div>

                <div class="board-frame">
                    <div class="board" id="goban" aria-label="15乘15五子棋棋盘"></div>
                </div>

                <div class="control-panel">
                    <div class="player-card">
                        <div class="indicator black-piece" aria-hidden="true"></div>
                        <div class="label">
                            <span>YOU · PLAYER</span>
                            <span>玩家 <small>黑棋</small></span>
                        </div>
                    </div>

                    <div class="turn-status" id="turnStatus" aria-live="polite">
                        <span class="dot"></span> 轮到你了
                    </div>

                    <div class="player-card ai-card">
                        <div class="indicator white-piece" aria-hidden="true"></div>
                        <div class="label">
                            <span>AI · OPPONENT</span>
                            <span>AI <small>白棋</small></span>
                        </div>
                    </div>
                </div>

                <div class="action-area">
                    <div class="action-caption">GAME CONTROL</div>
                    <div class="action-buttons">
                        <button class="btn" id="newGame" type="button">
                            <span class="button-icon" aria-hidden="true">↻</span> 新一局
                        </button>
                        <button class="btn reset" id="resetGame" type="button">
                            <span class="button-icon" aria-hidden="true">⌁</span> 重置棋盘
                        </button>
                    </div>
                </div>

                <div class="hint-note" id="hintNote">
                    <span class="hint-icon" aria-hidden="true">✦</span>
                    你执黑棋 · AI 执白棋 · 黑棋先手
                </div>
            </div>
        </section>

        <footer class="page-footer">
            <span>专注每一步 · 享受策略的乐趣</span>
            <span class="footer-mark">GOMOKU <i>•</i> 15×15</span>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
