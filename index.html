<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智谱 AI 问答</title>
<style>
  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --primary: #3b5bdb;
    --primary-dark: #2f4bbf;
    --text: #212529;
    --muted: #868e96;
    --border: #e4e8f0;
    --danger: #e03131;
    --warn-bg: #fff3bf;
    --warn-fg: #e67700;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 820px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
  }
  header {
    padding: 14px 20px;
    color: #fff;
    background: linear-gradient(135deg, #4263eb 0%, #7048e8 50%, #4263eb 100%);
    background-size: 200% 200%;
    animation: gradientFlow 9s ease infinite;
  }
  @keyframes gradientFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header .sub {
    margin: 4px 0 0;
    font-size: .8rem;
    opacity: .9;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .conn-dot { width: 9px; height: 9px; border-radius: 50%; background: #adb5bd; flex: none; transition: background .2s; }
  .conn-dot.ok { background: #40c057; }
  .conn-dot.off { background: #fa5252; }
  .conn-dot.wait { background: #ffd43b; animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .conn-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 16px;
    font-size: .85rem;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-bottom: 1px solid #ffe066;
    animation: slideDown .25s ease-out;
  }
  .conn-banner.hidden { display: none; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } }
  .conn-banner button {
    border: 1px solid var(--warn-fg);
    background: transparent;
    color: var(--warn-fg);
    border-radius: 6px;
    padding: 2px 12px;
    font-size: .8rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .conn-banner button:hover { background: var(--warn-fg); color: #fff; }
  .chat {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: .95rem;
    white-space: pre-wrap;
    word-break: break-word;
    animation: pop .28s cubic-bezier(.22, .9, .35, 1.18);
    transform-origin: bottom left;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
    transform-origin: bottom right;
  }
  .msg.error {
    align-self: center;
    background: #fff5f5;
    color: var(--danger);
    border: 1px solid #ffc9c9;
    font-size: .85rem;
    max-width: 92%;
  }
  .msg.typing { display: flex; align-items: center; padding: 14px 18px; }
  .msg.typing .dot {
    width: 7px;
    height: 7px;
    margin: 0 3px;
    border-radius: 50%;
    background: #adb5bd;
    animation: bounce 1.2s ease infinite;
  }
  .msg.typing .dot:nth-child(2) { animation-delay: .18s; }
  .msg.typing .dot:nth-child(3) { animation-delay: .36s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
  }
  .input-bar textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    font-size: .95rem;
    max-height: 140px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-bar textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 91, 219, .15); }
  .input-bar button {
    border: 0;
    background: var(--primary);
    color: #fff;
    padding: 0 22px;
    border-radius: 10px;
    font-size: .95rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, transform .1s, box-shadow .15s, opacity .15s;
  }
  .input-bar button:hover:not(:disabled) { background: var(--primary-dark); box-shadow: 0 3px 10px rgba(59, 91, 219, .35); }
  .input-bar button:active:not(:disabled) { transform: translateY(1px); }
  .input-bar button:disabled { opacity: .55; cursor: not-allowed; }
  .input-bar button.loading::before {
    content: "";
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 7px;
    border: 2px solid rgba(255, 255, 255, .4);
    border-top-color: #fff;
    border-radius: 50%;
    vertical-align: -2px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    margin: 0;
    padding: 0 16px 10px;
    font-size: .8rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
    transition: color .2s;
  }
  .status.warn { color: #e8590c; }
  .status.err { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .chat { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>智谱 AI 问答</h1>
    <p class="sub">
      <span class="conn-dot wait" id="conn-dot"></span>
      <span id="conn-text">连接中…</span>
      <span>· 每分钟最多 5 次提问</span>
    </p>
  </header>
  <div class="conn-banner hidden" id="conn-banner">
    <span>后端连接断开，请确认服务已启动</span>
    <button type="button" id="retry-btn">重试连接</button>
  </div>
  <main class="chat" id="chat">
    <div class="msg bot">你好！我是基于智谱 GLM 的问答助手，把你的问题发给我吧。</div>
  </main>
  <form class="input-bar" id="form">
    <textarea id="input" rows="1" placeholder="输入你的问题（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
  <p class="status" id="status"></p>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('form');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');
  const connBanner = document.getElementById('conn-banner');
  const retryBtn = document.getElementById('retry-btn');

  // ===== 后端地址配置 =====
  // 推荐留空：与网页同源，直接用浏览器打开后端地址（如 http://127.0.0.1:8000）即可。
  // 前后端分离部署时改成完整地址，例如 'http://192.168.1.100:8000'。
  const API_BASE = '';
  // 双击本地文件（file://）且未配置地址时，自动指向本机后端
  const API_BASE_EFFECTIVE = API_BASE || (location.protocol === 'file:' ? 'http://1xsever.f1.luyouxia.net:13323' : '');

  const HEALTH_TIMEOUT_MS = 5000;    // 健康检查超时
  const HEALTH_INTERVAL_MS = 30000;  // 后台轮询间隔

  let sending = false;
  let keyWarned = false;
  let typingEl = null;

  function addMessage(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;  // textContent 渲染，防 XSS，不解析 HTML
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setStatus(text, level) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (level ? ' ' + level : '');
  }

  function setConnState(state, label) {
    connDot.className = 'conn-dot ' + state;
    connText.textContent = label || '';
    connBanner.classList.toggle('hidden', state !== 'off');
  }

  function showTyping() {
    hideTyping();
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    typingEl = div;
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // 健康检查：带重试退避；silent 模式用于后台轮询（不打扰用户）
  async function checkHealth(retries = 3, silent = false) {
    if (!silent) setConnState('wait', '连接中…');
    for (let i = 0; i < retries; i++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), HEALTH_TIMEOUT_MS);
      try {
        const res = await fetch(API_BASE_EFFECTIVE + '/api/health', { signal: ctrl.signal });
        const h = await res.json();
        if (h.key_configured) {
          setConnState('ok', '在线 · ' + h.model);
          if (!silent) setStatus('当前模型：' + h.model + ' · 每分钟最多 ' + h.rate_limit_per_minute + ' 次');
        } else {
          setConnState('ok', '在线 · 未配置 Key');
          if (!keyWarned) {
            keyWarned = true;
            addMessage('error', '⚠ 提示：后端未配置 API Key（.env 的 ZHIPU_API_KEY 为空），当前无法回答问题。');
          }
        }
        return;
      } catch (e) {
        if (i < retries - 1) await new Promise(r => setTimeout(r, 1500 * (i + 1)));
      } finally {
        clearTimeout(timer);
      }
    }
    setConnState('off', '后端离线');
    if (!silent && !statusEl.textContent) setStatus('无法连接到后端 ' + API_BASE_EFFECTIVE, 'err');
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sending) return;
    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    sending = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    setStatus('思考中…');
    showTyping();
    try {
      const res = await fetch(API_BASE_EFFECTIVE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json().catch(() => null);
      if (res.ok) {
        addMessage('bot', data.reply || '（空回答）');
        setStatus('');
      } else {
        let msg = (data && (data.error || data.detail)) || '请求失败（HTTP ' + res.status + '）';
        if (typeof msg === 'object') msg = JSON.stringify(msg);
        if (res.status === 429 && data && data.retry_after_seconds) {
          msg += '，约 ' + data.retry_after_seconds + ' 秒后可重试';
        }
        addMessage('error', '⚠ ' + msg);
        setStatus(msg, 'err');
      }
    } catch (e) {
      const t = '⚠ 无法连接后端（' + API_BASE_EFFECTIVE + '）：请确认后端已启动、地址端口正确、防火墙已放行。';
      addMessage('error', t);
      setStatus(t.slice(2), 'err');
      setConnState('off', '后端离线');
    } finally {
      hideTyping();
      sending = false;
      sendBtn.disabled = false;
      sendBtn.classList.remove('loading');
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  retryBtn.addEventListener('click', () => checkHealth(2));
  window.addEventListener('online', () => checkHealth(2));
  window.addEventListener('offline', () => setConnState('off', '网络离线'));

  if (location.protocol === 'file:' && !API_BASE) {
    addMessage('error', '⚠ 提示：当前是双击打开的本地文件，已自动连接 http://zz.frp.one:55655。建议直接在浏览器地址栏访问该地址。');
  }

  checkHealth();
  setInterval(() => { if (!sending) checkHealth(1, true); }, HEALTH_INTERVAL_MS);
</script>
</body>
</html>
